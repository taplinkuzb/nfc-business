<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, follow">
<title>Контакты | Taplinkuzb</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--border:#e5e5e5;--text:#171717;--muted:#777777}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:28px 18px;display:flex;align-items:center;justify-content:center;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
main{width:100%;max-width:420px}
.links{display:grid;gap:14px}
.link{min-height:62px;display:flex;align-items:center;gap:14px;padding:13px 17px;border:1px solid var(--border);border-radius:12px;background:#ffffff;color:var(--text);text-decoration:none;font-size:16px;font-weight:600;transition:transform .15s,border-color .15s}
.link:active{transform:scale(.985)}
.link:hover{border-color:#bdbdbd}
.icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center}
.icon svg{width:27px;height:27px;display:block}
.arrow{margin-left:auto;color:#999999;font-size:21px;font-weight:400}
#empty{display:none;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:22px 14px}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<main aria-label="Контакты">
<nav class="links" id="links">
<a class="link" id="instagram" hidden target="_blank" rel="noopener noreferrer"><span class="icon" style="color:#555555"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/></svg></span><span>Instagram</span><span class="arrow">›</span></a>
<a class="link" id="telegram" hidden target="_blank" rel="noopener noreferrer"><span class="icon" style="color:#555555"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 3.3 18.5 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.5l-4.9-1.6c-1.1-.4-1.1-1.1.2-1.6L20.4 2c.9-.3 1.7.2 1.3 1.3Z"/></svg></span><span>Telegram</span><span class="arrow">›</span></a>
<a class="link" id="yandex" hidden target="_blank" rel="noopener noreferrer"><span class="icon" style="color:#555555"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 5.7 8 12 8 12s8-6.3 8-12a8 8 0 0 0-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg></span><span>Yandex Maps</span><span class="arrow">›</span></a>
<a class="link" id="google" hidden target="_blank" rel="noopener noreferrer"><span class="icon" style="color:#555555"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>Google Отзывы</span><span class="arrow">›</span></a>
<a class="link" id="phone" hidden><span class="icon" style="color:#555555"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.5v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 1.1 3.7 2 2 0 0 1 3.1 1.5h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L7 9.5a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2.1Z"/></svg></span><span>Позвонить</span><span class="arrow">›</span></a>
</nav>
<div id="empty">Эта NFC-страница ещё не настроена.<br>Добавьте ссылки клиента в адрес страницы.</div>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const fields={instagram:'instagram',telegram:'telegram',yandex:'yandex',google:'google'};
 let shown=0;
 function safeUrl(value){
   if(!value)return '';
   try{
     const u=new URL(value);
     return (u.protocol==='https:'||u.protocol==='http:')?u.href:'';
   }catch(e){return ''}
 }
 Object.entries(fields).forEach(([key,id])=>{
   const value=safeUrl(params.get(key));
   if(value){const el=document.getElementById(id);el.href=value;el.hidden=false;shown++;}
 });
 const phone=(params.get('phone')||'').replace(/[^+\d]/g,'');
 if(phone.length>=7){
   const el=document.getElementById('phone');
   el.href='tel:'+phone;el.hidden=false;shown++;
 }
 if(!shown)document.getElementById('empty').style.display='block';
})();
</script>
</body>
</html>
