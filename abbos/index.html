h1{font-size:32px;line-height:1.18;letter-spacing:-.7px;margin:22px 4px 12px;font-weight:700}
.role{font-size:22px;line-height:1.4;margin:0 4px 42px;color:#f1f1f4}
.details{display:grid;gap:22px;margin:0 8px 50px}
.detail{display:flex;align-items:center;gap:13px;color:#e2e3e8;text-decoration:none;font-size:20px;line-height:1.35}
.detail svg{width:27px;height:27px;flex:none;stroke:#a4a8b2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.social-title{font-size:19px;color:#e6e7eb;margin:0 8px 26px}
.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.social{min-height:122px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:#e7e8ed;text-decoration:none;font-size:16px}
.social-icon{width:88px;height:88px;border-radius:27px;background:linear-gradient(145deg,#252a35,#1e222b);box-shadow:7px 7px 18px #11141b,-5px -5px 16px #303541;border:1px solid #303541;display:grid;place-items:center}
.social-icon svg{width:43px;height:43px;stroke:#bfc2cb;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:420px){.cover{height:225px}.brand{width:225px;height:150px;font-size:20px}.profile{padding:0 22px}.topline{gap:14px;min-height:132px}.avatar{width:145px;height:145px}.add{min-height:52px;font-size:15px;gap:7px}h1{font-size:27px;margin-top:22px}.role{font-size:19px;margin-bottom:36px}.detail{font-size:18px}.details{gap:20px;margin-bottom:43px}.social-icon{width:82px;height:82px}}
