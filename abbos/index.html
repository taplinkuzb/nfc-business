<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#12151d;--line:#252a35;--muted:#a3a9b7;--accent:#b7f36b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at 50% 0%,#26351e 0%,#10131a 35%,var(--bg) 72%);color:#f7f8fa;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;align-items:center}
main{width:100%;max-width:430px;text-align:center}.card{padding:34px 24px 28px;background:linear-gradient(160deg,#171b24,#101219);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 80px #0008}

h1{font-size:25px;line-height:1.2;margin:0 0 9px;letter-spacing:-.5px}.role{color:var(--muted);margin:0 0 25px;font-size:14px}.brand{color:var(--accent);font-weight:700}
.actions{display:grid;gap:12px}.action{min-height:54px;padding:14px 18px;border:1px solid #303744;border-radius:15px;background:#1a1f29;color:#f7f8fa;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:11px;font-weight:650;transition:.2s}.action.primary{background:var(--accent);border-color:var(--accent);color:#12180c}.action:active{transform:scale(.985)}.icon{width:21px;height:21px;display:inline-grid;place-items:center;font-size:19px}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.social{min-height:52px}.note{margin:22px 0 0;color:#747d8c;font-size:12px}.footer{margin-top:18px;color:#7e8795;font-size:12px;letter-spacing:1.8px}
</style>
</head>
