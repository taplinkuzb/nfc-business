<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Abbos Mirkhonov — Personal NFC Card</title>
<meta name="description" content="Персональная NFC-визитка Аббоса Мирхонова. Programmer at Taplinkuzb.">
<meta property="og:title" content="Abbos Mirkhonov — Taplinkuzb">
<meta property="og:description" content="Personal digital business card. Tap to connect.">
<meta property="og:image" content="https://taplinkuzb.uz/abbos/abbos.jpg">
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#11110f;--gold:#c9a66b;--gold2:#f0d7a0;--text:#f7f2e9;--muted:#b8ad9b;--line:#403522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#302516 0,transparent 42%),linear-gradient(145deg,#090909,#11100d 55%,#070707)}
main{width:100%;max-width:560px;min-height:100vh;margin:0 auto;padding:30px 22px 42px;position:relative;overflow:hidden}
main:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(135deg,transparent 0 72px,#9c7940 73px,#9c7940 74px,transparent 75px 145px);mask-image:linear-gradient(180deg,#000,transparent 65%)}
header,.profile,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 24px;border-bottom:1px solid #8f744433}
.brand{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold2);font-weight:700}
.serial{font-size:10px;letter-spacing:2px;color:#8e8069}
.profile{padding-top:34px}
.portrait-wrap{width:100%;height:390px;position:relative;overflow:hidden;border:1px solid #b9975b88;border-radius:22px;background:linear-gradient(145deg,#262018,#090909);box-shadow:0 24px 70px #000b}
.portrait-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 54%,#080807e8 100%),linear-gradient(115deg,#c9a66b18,transparent 42%)}
.avatar{width:100%;height:100%;object-fit:cover;object-position:center 27%;filter:saturate(.78) contrast(1.06)}
.corner{position:absolute;z-index:2;top:18px;right:18px;border:1px solid #d7b77b99;border-radius:30px;padding:8px 12px;color:var(--gold2);font-size:10px;letter-spacing:2px;background:#09090988;backdrop-filter:blur(8px)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,8vw,48px);line-height:1.02;letter-spacing:.3px;font-weight:500;margin:28px 0 12px;color:var(--gold2)}
.role{margin:0;color:var(--muted);font-size:13px;letter-spacing:2.5px;text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:28px 0}
.socials{display:grid;gap:12px}
.social{display:flex;align-items:center;gap:15px;min-height:66px;padding:0 17px;border:1px solid #80663b88;border-radius:14px;text-decoration:none;color:var(--text);background:linear-gradient(110deg,#17140f,#0d0d0c);transition:transform .2s,border-color .2s}
.social:active{transform:scale(.985)}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid #b9975b88;color:var(--gold2);font-size:16px}
.social-label{font-size:14px;letter-spacing:.4px}
.social small{display:block;color:#9f927c;font-size:10px;letter-spacing:1.4px;margin-top:3px;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.action{min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;text-decoration:none;font-size:12px;letter-spacing:1px;font-weight:700}
.primary{background:linear-gradient(135deg,#e2c58e,#a78349);color:#17120a;box-shadow:0 8px 24px #b18c4a33}
.secondary{border:1px solid #8f744488;color:var(--gold2);background:#11100d}
footer{margin-top:34px;text-align:center;color:#756a59;font-size:9px;letter-spacing:3px;text-transform:uppercase}
@media(max-width:390px){main{padding:24px 17px 34px}.portrait-wrap{height:340px}.profile{padding-top:26px}}
</style>
</head>
<body>
<main>
<header><div class="brand">Taplinkuzb</div><div class="serial">PERSONAL ID · 001</div></header>
<section class="profile" aria-label="Персональная NFC-визитка Аббоса Мирхонова">
<div class="portrait-wrap"><img class="avatar" src="abbos.jpg" alt="Аббос Мирхонов"><span class="corner">NFC ENABLED</span></div>
<h1>Abbos<br>Mirkhonov</h1>
<p class="role">Programmer · Taplinkuzb</p>
<div class="rule"></div>
<div class="socials">
<a class="social" href="https://www.instagram.com/mirxonov_abbos/" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span><span class="social-label">Instagram<small>@mirxonov_abbos</small></span></a>
<a class="social" href="https://t.me/Mas01055" target="_blank" rel="noopener noreferrer"><span class="icon">➤</span><span class="social-label">Telegram<small>@Mas01055</small></span></a>
</div>
<div class="actions">
<a class="action primary" href="abbos.vcf" download>СОХРАНИТЬ КОНТАКТ</a>
<a class="action secondary" href="https://taplinkuzb.uz/" target="_blank" rel="noopener noreferrer">TAPLINKUZB</a>
</div>
</section>
<footer>One tap. One connection.</footer>
</main>
</body>
</html>
