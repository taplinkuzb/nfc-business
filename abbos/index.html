<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Аббос Мирхонов — персональная NFC-визитка</title>
<meta name="description" content="Персональная NFC-визитка Аббоса Мирхонова Садуллоевича — программист Taplinkuzb. Контакты, Instagram и Telegram.">
<meta property="og:title" content="Аббос Мирхонов — Programmer">
<meta property="og:description" content="Персональная цифровая визитка. Один контакт — одно касание.">
<meta property="og:image" content="https://taplinkuzb.uz/abbos/abbos.jpg">
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#101722;--line:#243449;--blue:#39a9ff;--cyan:#5ce1e6;--muted:#9baabd;--white:#f4f8ff}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;padding:30px 16px 24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% -12%,#12335b 0,transparent 52%),radial-gradient(ellipse at 90% 85%,#09243a 0,transparent 38%),var(--bg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--white)}
main{width:100%;max-width:440px}
.card{position:relative;overflow:hidden;border:1px solid #29425d;border-radius:30px;background:linear-gradient(155deg,rgba(21,31,46,.97),rgba(10,15,24,.99));box-shadow:0 28px 90px #000b,0 0 45px #168cff18}
.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),transparent);z-index:2}
.cover{height:205px;position:relative;background:#07152b url("programmer-bg.svg") center 48%/cover no-repeat}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07101a20 25%,#0c1421 100%)}
.cover-label{position:absolute;z-index:1;top:18px;left:20px;padding:7px 11px;border:1px solid #5bbcff55;border-radius:30px;background:#06111dcc;color:#a9d9ff;font:700 10px/1.2 ui-monospace,monospace;letter-spacing:2px}
.profile{position:relative;margin-top:-78px;padding:0 25px 28px;text-align:center;z-index:1}
.avatar{display:block;width:132px;height:132px;margin:0 auto 17px;border-radius:50%;object-fit:cover;border:4px solid #eaf7ff;background:#101827;box-shadow:0 0 0 7px #168cff38,0 0 38px #168cff88}
h1{margin:0;color:#fff;font-size:27px;line-height:1.2;letter-spacing:-.7px}
.role{margin:9px 0 0;color:var(--muted);font-size:14px}
.role strong{color:#69c4ff;font-weight:700}
.rule{height:1px;margin:23px 0;background:linear-gradient(90deg,transparent,#38506b,transparent)}
.actions{display:grid;gap:11px}
.action{min-height:54px;padding:13px 17px;border:1px solid #30465f;border-radius:15px;background:linear-gradient(135deg,#172435,#101824);display:flex;align-items:center;justify-content:center;gap:11px;color:#f5f9ff;text-decoration:none;font-weight:650;transition:transform .18s,border-color .18s,filter .18s}
.action:active{transform:scale(.985)}
.action:hover{border-color:#5abaff;filter:brightness(1.12)}
.action.primary{border-color:#3baaff;background:linear-gradient(110deg,#0877db,#16a8db);box-shadow:0 8px 28px #0789df3b;color:white}
.icon{width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.social{min-height:52px;background:#0c1521}
.hint{margin:19px 0 0;color:#8292a8;font-size:12px}
.signature{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;color:#8099b7;font:700 10px/1.4 ui-monospace,monospace;letter-spacing:2.7px}
.signature:before,.signature:after{content:"";width:23px;height:1px;background:#315071}
@media(max-width:380px){body{padding:18px 12px}.cover{height:180px}.profile{padding-left:18px;padding-right:18px}h1{font-size:24px}.avatar{width:120px;height:120px}}
</style>
</head>
<body>
<main>
<section class="card" aria-label="Персональная визитка Аббоса Мирхонова">
  <div class="cover"><span class="cover-label">DEVELOPER PROFILE · 2026</span></div>
  <div class="profile">
    <img class="avatar" src="abbos.jpg" alt="Фото Аббоса Мирхонова">
    <h1>Аббос Мирхонов<br>Садуллоевич</h1>
    <p class="role">Programmer · <strong>Taplinkuzb</strong></p>
    <div class="rule"></div>
    <div class="actions">
      <a class="action primary" href="abbos.vcf" download>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><path d="M4 3h16v18H4z" opacity=".0"/></svg></span>
        Добавить контакт
      </a>
      <a class="action" href="tel:+998918445054">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 16.5v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 10.2 18a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 1.8 3.2 2 2 0 0 1 3.8 1h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.7L7 9a16 16 0 0 0 6 6l1.6-1.7a2 2 0 0 1 1.7-.6l3 .5a2 2 0 0 1 1.7 2z"/></svg></span>
        +998 91 844 50 54
      </a>
    </div>
    <div class="socials">
      <a class="action social" href="https://www.instagram.com/mirxonov_abbos/" target="_blank" rel="noopener noreferrer">
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
        Instagram
      </a>
      <a class="action social" href="https://t.me/Mas01055" target="_blank" rel="noopener noreferrer">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg></span>
        Telegram
      </a>
    </div>
    <p class="hint">Сохраните мой контакт одним нажатием.</p>
  </div>
</section>
<div class="signature">BUILD · AUTOMATE · INNOVATE</div>
</main>
</body>
</html>
