<style>
:root{--wine:#5b102b;--burgundy:#811b40;--pink:#ef397d;--pale:#f1dce5}
*{box-sizing:border-box}
html{min-height:100%;background:#070507}
body{margin:0;min-height:100vh;color:#fff;font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 50% 28%,#481025 0%,#1a0811 35%,#080608 72%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none}
body:before{opacity:.6;background:radial-gradient(ellipse at -8% 0%,transparent 35%,#9d164733 36%,transparent 37%),radial-gradient(ellipse at 110% 85%,transparent 32%,#a51c4c2e 33%,transparent 34%),linear-gradient(135deg,transparent 45%,#9c17401a 46%,transparent 47%);filter:blur(1px)}
body:after{background:linear-gradient(180deg,transparent 70%,#050405 100%);z-index:0}
.wrap{position:relative;z-index:1;width:min(100%,520px);min-height:100vh;margin:auto;padding:34px 24px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.crown{font-size:28px;color:#e63b7b;text-shadow:0 0 16px #f13d83;margin-bottom:-6px}
.avatar{width:218px;height:218px;border-radius:50%;padding:5px;margin:0 auto 28px;background:linear-gradient(145deg,#ff5b9b,#6c1233 45%,#ed2e78);box-shadow:0 0 12px #f22b7b,0 0 42px #bd1c5b99,0 0 90px #7d153d66}
.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #160710}
h1{margin:0;text-align:center;font-size:clamp(28px,7vw,38px);font-weight:800;letter-spacing:.5px;color:#f1edf0;text-shadow:0 3px 15px #fff3,0 0 25px #a72b5a66}
.tagline{margin:12px 0 38px;text-align:center;font-size:15px;letter-spacing:7px;color:#d6c4cc;text-transform:none}
.rule{width:52%;height:1px;margin:-22px auto 29px;background:linear-gradient(90deg,transparent,#e7357b,transparent);box-shadow:0 0 12px #ed397d}
.links{width:100%;display:grid;gap:15px}
.link{min-height:76px;width:100%;display:grid;grid-template-columns:82px 1fr 42px;align-items:center;padding:0 17px 0 20px;border:1px solid #f13b83;border-radius:50px;text-decoration:none;color:#f8f4f6;background:linear-gradient(100deg,#10070dF2,#190811e8 55%,#0b070bf5);box-shadow:0 0 10px #e82c7655,inset 0 0 18px #a6194a24,0 8px 25px #0009;transition:.22s}
.link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 0 17px #f13b83aa,inset 0 0 24px #a6194a44,0 10px 28px #000b;outline:none}
.symbol{display:grid;place-items:center;height:38px;border-right:1px solid #c22b65;color:#fa4c91;font-size:29px;text-shadow:0 0 12px #f02f80}
.label{padding-left:22px;font-size:20px;letter-spacing:.2px}
.arrow{width:38px;height:38px;border:1px solid #a91d55;border-radius:50%;display:grid;place-items:center;color:#f14a8c;font-size:24px;box-shadow:0 0 12px #a51b4b33}
.footer{margin-top:38px;text-align:center;color:#c9aab7;font-size:11px;letter-spacing:6px}
.footer:before{content:"♛";display:block;margin-bottom:14px;color:#ed3c80;font-size:29px;letter-spacing:0;text-shadow:0 0 16px #ed3c80}
@media(max-width:380px){.wrap{padding:28px 17px}.avatar{width:190px;height:190px}.link{min-height:68px;grid-template-columns:66px 1fr 38px;padding:0 13px}.label{font-size:18px;padding-left:16px}.tagline{letter-spacing:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
